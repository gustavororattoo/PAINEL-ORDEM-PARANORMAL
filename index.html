<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.R.I.S. - Central de Rastreamento e Identificação de Sobrenaturais</title>
    <style>
        /* ESTÉTICA FIEL AO LOGOTIPO ORIGINAL (image_313c3e.png) */
        body {
            background-color: #050505;
            color: #e2e2e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            color: #ffffff; /* Branco Puro igual ao logo anexado */
            font-family: Georgia, 'Times New Roman', Times, serif; /* Fonte clássica com serifa */
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            font-size: 32px;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        .subtitulo {
            color: #8a8a93;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* MONITOR DE TRANSMISSÃO */
        .monitor-paranormal {
            width: 100%;
            height: 480px;
            border: 1px solid #333;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        .monitor-paranormal::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.02));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        .monitor-paranormal img, .monitor-paranormal video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        #status-texto {
            color: #8a8a93;
            font-size: 14px;
            text-align: center;
            z-index: 1;
            letter-spacing: 2px;
            line-height: 1.6;
            padding: 20px;
        }

        /* PAINEL DE NAVEGAÇÃO */
        .painel-navegacao {
            background-color: #0d0d11;
            border: 1px solid #1a1a22;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .camada-botoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .escondido {
            display: none !important;
        }

        button {
            background-color: #121216;
            color: #b5b5bc;
            border: 1px solid #2a2a32;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-align: left;
        }

        button:hover {
            background-color: #1c1c24;
            color: #fff;
            border-color: #55555d;
        }

        /* Botões de Missão */
        .btn-missao {
            border-left: 4px solid #ffffff;
            font-size: 14px;
            color: #ffffff;
            background-color: #141416;
        }
        .btn-missao:hover {
            background-color: #222226;
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Botões de Categorias */
        .btn-categoria {
            border-left: 4px solid #8a8a93;
            padding-left: 20px;
        }

        /* Botões de Arquivos Finais */
        .btn-midia {
            border-left: 4px solid #444;
            padding-left: 30px;
            font-size: 12px;
        }
        .btn-midia:hover {
            border-left-color: #ffffff;
            background-color: #1a1a22;
        }

        .btn-voltar {
            border: 1px dashed #555;
            color: #8a8a93;
            text-align: center;
        }
        .btn-voltar:hover {
            color: #fff;
            border-color: #fff;
        }

        .btn-sistema {
            border: 1px solid #ff3333;
            color: #ff3333;
            background-color: #1a0505;
            text-align: center;
            grid-column: 1 / -1;
        }
        .btn-sistema:hover {
            background-color: #ff3333;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>ORDEM PARANORMAL</h1>
        <div class="subtitulo">Central de Rastreamento e Identificação de Sobrenaturais (C.R.I.S)</div>
    </div>

    <div class="container">
        <div class="monitor-paranormal">
            <p id="status-texto">[ ∅ ]<br><br>CONEXÃO CRIPTOGRAFADA ESTÁVEL.<br>AGUARDANDO SELEÇÃO DE ARQUIVO DA C.R.I.S</p>
            <img id="display-imagem" src="" alt="Evidência Visual">
            <video id="display-video" src="" loop muted playsinline></video>
        </div>

        <audio id="audio-player" loop></audio>

        <div class="painel-navegacao">
            
            <!-- CAMADA 1: SELEÇÃO DE MISSÃO -->
            <div id="camada-missoes" class="camada-botoes">
                <button class="btn-missao" onclick="abrirMissao('missao1')">📁 MISSÃO 01: O ORFANATO</button>
                <button class="btn-missao" onclick="abrirMissao('missao2')">📁 MISSÃO 02: CARGA MORTAL</button>
                <button class="btn-sistema" onclick="encerrarSessao()">🛑 ENCERRAMENTO (CRÉDITOS)</button>
            </div>

            <!-- ========================================== -->
            <!-- ESTRUTURA DA MISSÃO 1                      -->
            <!-- ========================================== -->
            <div id="categorias-missao1" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaMissoes()">⬅️ VOLTAR PARA MISSÕES</button>
                <button class="btn-categoria" onclick="abrirSubpasta('m1-personagens')"> PERSONAGENS</button>
                <button class="btn-categoria" onclick="abrirSubpasta('m1-monstros')"> MONSTROS</button>
                <button class="btn-categoria" onclick="abrirSubpasta('m1-lugares')"> EVENTOS E LUGARES</button>
            </div>

            <div id="m1-personagens" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaCategorias('missao1')">⬅️ VOLTAR</button>
                <button class="btn-midia" onclick="carregarCena('jennifer')">📄 Jennifer Martins</button>
                <button class="btn-midia" onclick="carregarCena('Mariana')">📄 Mariana W. Lopes</button>
            </div>

            <div id="m1-monstros" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaCategorias('missao1')">⬅️ VOLTAR</button>
                <button class="btn-midia" onclick="carregarCena('degolificada')"> A Degolificada</button>
            </div>

            <div id="m1-lugares" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaCategorias('missao1')">⬅️ VOLTAR</button>
                <button class="btn-midia" onclick="carregarCena('fachada-orfanato')"> Fachada do Orfanato</button>
                <button class="btn-midia" onclick="carregarCena('sala-rituais')"> Sala do Ritual</button>
            </div>

            <!-- ========================================== -->
            <!-- ESTRUTURA DA MISSÃO 2: CARGA MORTAL        -->
            <!-- ========================================== -->
            <div id="categorias-missao2" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaMissoes()">⬅️ VOLTAR PARA MISSÕES</button>
                <button class="btn-categoria" onclick="abrirSubpasta('m2-personagens')">👥 PERSONAGENS</button>
                <button class="btn-categoria" onclick="abrirSubpasta('m2-monstros')">💀 MONSTROS</button>
                <button class="btn-categoria" onclick="abrirSubpasta('m2-lugares')">👁️ EVENTOS E LUGARES</button>
            </div>

            <div id="m2-personagens" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaCategorias('missao2')">⬅️ VOLTAR</button>
                <button class="btn-midia" onclick="carregarCena('m2-npc1')">📄 Suspeito 01</button>
                <button class="btn-midia" onclick="carregarCena('m2-npc2')">📄 Contato da Ordem</button>
            </div>

            <div id="m2-monstros" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaCategorias('missao2')">⬅️ VOLTAR</button>
                <button class="btn-midia" onclick="carregarCena('m2-criatura')">⚠️ Ameaça Paranormal</button>
            </div>

            <div id="m2-lugares" class="camada-botoes escondido">
                <button class="btn-voltar" onclick="voltarParaCategorias('missao2')">⬅️ VOLTAR</button>
                <button class="btn-midia" onclick="carregarCena('m2-local1')">📍 Local da Carga</button>
            </div>

        </div>
    </div>

    <script>
        // BANCO DE DADOS DE MÍDIAS
        const dadosCenas = {
            // --- MISSÃO 1 ---
            jennifer: {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' 
            },
            kian: {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' 
            },
            degolificada: {
                tipo: 'video',
                visual: 'https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-41763-large.mp4', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' 
            },
            'fachada-orfanato': {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=800', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' 
            },
            'sala-rituais': {
                tipo: 'video',
                visual: 'https://assets.mixkit.co/videos/preview/mixkit-fire-burning-in-the-dark-41484-large.mp4', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' 
            },

            // --- MISSÃO 2 ---
            'm2-npc1': {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' 
            },
            'm2-npc2': {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=800', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3' 
            },
            'm2-criatura': {
                tipo: 'video',
                visual: 'https://assets.mixkit.co/videos/preview/mixkit-smoke-and-lights-background-41762-large.mp4', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3' 
            },
            'm2-local1': {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=800', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3' 
            },

            // --- CRÉDITOS ---
            creditos: {
                tipo: 'imagem',
                visual: 'https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=1200', 
                audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3' 
            }
        };

        // SISTEMA DE NAVEGAÇÃO
        function ocultarTodosOsPaineis() {
            const paineis = document.querySelectorAll('.camada-botoes');
            paineis.forEach(p => p.classList.add('escondido'));
        }

        function abrirMissao(idMissao) {
            ocultarTodosOsPaineis();
            if(idMissao === 'missao1') {
                document.getElementById('categorias-missao1').classList.remove('escondido');
            } else if(idMissao === 'missao2') {
                document.getElementById('categorias-missao2').classList.remove('escondido');
            }
        }

        function abrirSubpasta(idSubpasta) {
            ocultarTodosOsPaineis();
            document.getElementById(idSubpasta).classList.remove('escondido');
        }

        function voltarParaMissoes() {
            ocultarTodosOsPaineis();
            document.getElementById('camada-missoes').classList.remove('escondido');
        }

        function voltarParaCategorias(missao) {
            ocultarTodosOsPaineis();
            if(missao === 'missao1') {
                document.getElementById('categorias-missao1').classList.remove('escondido');
            } else if(missao === 'missao2') {
                document.getElementById('categorias-missao2').classList.remove('escondido');
            }
        }

        // CONTROLADOR DE MÍDIA
        function carregarCena(idCena) {
            const cena = dadosCenas[idCena];
            if (!cena) return;

            const img = document.getElementById('display-imagem');
            const video = document.getElementById('display-video');
            const audio = document.getElementById('audio-player');
            const status = document.getElementById('status-texto');

            status.style.display = 'none';

            if(cena.tipo === 'imagem') {
                video.style.display = 'none';
                video.pause();
                img.src = cena.visual;
                img.style.display = 'block';
            } else if (cena.tipo === 'video') {
                img.style.display = 'none';
                video.src = cena.visual;
                video.style.display = 'block';
                video.play();
            }

            audio.src = cena.audio;
            audio.play().catch(e => console.log("Áudio aguardando clique para iniciar."));
        }

        // TELA DE CRÉDITOS
        function encerrarSessao() {
            carregarCena('creditos');
            const status = document.getElementById('status-texto');
            status.innerHTML = "[ CONEXÃO ENCERRADA PELA CENTRAL C.R.I.S. ]<br><br>Sessão concluída com sucesso.<br>Obrigado por jogarem hoje.<br><br><i>O Medo é a única constante...</i>";
            status.style.display = 'block';
            status.style.color = '#ffffff';
            status.style.position = 'absolute';
            status.style.textShadow = '2px 2px 5px #000';
        }
    </script>
</body>
</html>
