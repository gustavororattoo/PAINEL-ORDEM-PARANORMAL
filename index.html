    <style>
        /* ESTÉTICA FIEL AO LOGOTIPO ORIGINAL */
        body {
            background-color: #050505;
            color: #e2e2e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }

        .header-container {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            color: #ffffff; 
            font-family: Georgia, 'Times New Roman', Times, serif; 
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            font-size: 32px;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        .subtitulo {
            color: #8a8a93;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* MONITOR DE TRANSMISSÃO - CORRIGIDO PARA EVITAR DISTORÇÃO */
        .monitor-paranormal {
            width: 100%;
            height: 480px;
            border: 1px solid #333;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        .monitor-paranormal::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.02));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        /* AJUSTE AQUI: Mudado de cover para contain e adicionado max-width/max-height */
        .monitor-paranormal img, .monitor-paranormal video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: none;
            z-index: 1;
        }

        #status-texto {
            color: #8a8a93;
            font-size: 14px;
            text-align: center;
            z-index: 1;
            letter-spacing: 2px;
            line-height: 1.6;
            padding: 20px;
        }

        /* PAINEL DE NAVEGAÇÃO */
        .painel-navegacao {
            background-color: #0d0d11;
            border: 1px solid #1a1a22;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        .camada-botoes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .escondido {
            display: none !important;
        }

        button {
            background-color: #121216;
            color: #b5b5bc;
            border: 1px solid #2a2a32;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-align: left;
        }

        button:hover {
            background-color: #1c1c24;
            color: #fff;
            border-color: #55555d;
        }

        /* Botões de Missão */
        .btn-missao {
            border-left: 4px solid #ffffff;
            font-size: 14px;
            color: #ffffff;
            background-color: #141416;
        }
        .btn-missao:hover {
            background-color: #222226;
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);

        /* Botões de Arquivos Finais */

            text-align: center;

            background-color: #1a0505;
            text-align: center;

        }
        .btn-sistema:hover {

            color: #000;

        // SISTEMA DE NAVEGAÇÃO
        function ocultarTodosOsPaineis() {
            const paineis = document.querySelectorAll('.camada-botoes');
            paineis.forEach(p => p.classList.add('escondido'));
        }

        function abrirMissao(idMissao) {
            ocultarTodosOsPaineis();
            if(idMissao === 'missao1') {
                document.getElementById('categorias-missao1').classList.remove('escondido');
            } else if(idMissao === 'missao2') {
                document.getElementById('categorias-missao2').classList.remove('escondido');
            }
        }

        function abrirSubpasta(idSubpasta) {
            ocultarTodosOsPaineis();
            document.getElementById(idSubpasta).classList.remove('escondido');
        }

        function voltarParaMissoes() {
            ocultarTodosOsPaineis();
            document.getElementById('camada-missoes').classList.remove('escondido');
        }

        function voltarParaCategorias(missao) {
            ocultarTodosOsPaineis();
            if(missao === 'missao1') {
                document.getElementById('categorias-missao1').classList.remove('escondido');
            } else if(missao === 'missao2') {
                document.getElementById('categorias-missao2').classList.remove('escondido');
            }
        }

        // CONTROLADOR DE MÍDIA
        function carregarCena(idCena) {
            const cena = dadosCenas[idCena];
            if (!cena) return;

            const img = document.getElementById('display-imagem');
            const video = document.getElementById('display-video');
            const audio = document.getElementById('audio-player');
            const status = document.getElementById('status-texto');

            status.style.display = 'none';

            if(cena.tipo === 'imagem') {
                video.style.display = 'none';
                video.pause();
                img.src = cena.visual;
                img.style.display = 'block';
            } else if (cena.tipo === 'video') {
                img.style.display = 'none';
                video.src = cena.visual;
                video.style.display = 'block';
                video.play();
            }

            audio.src = cena.audio;
            audio.play().catch(e => console.log("Áudio aguardando clique para iniciar."));
        }
